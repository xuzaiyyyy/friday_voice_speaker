# Friday voice speaker runtime config.
# Format: KEY=value. Lines starting with # are ignored.
# Relative model/resource paths are resolved from this config file's directory.

# Hardware
XIAOMAN_MIC_DEVICE=plughw:1,0
XIAOMAN_CAMERA_DEV=/dev/video0
XIAOMAN_CAMERA_WIDTH=640
XIAOMAN_CAMERA_HEIGHT=480
XIAOMAN_CAMERA_FPS=15
XIAOMAN_CAMERA_MJPEG=1
XIAOMAN_CAMERA_PREVIEW_FILE=/tmp/friday_voice_speaker_camera.jpg
XIAOMAN_CAMERA_PREVIEW_INTERVAL_MS=160
XIAOMAN_LCD_ENABLED=1
XIAOMAN_LCD_SPI_DEV=/dev/spidev3.0
# LCD-1.47 on the expansion board is usually a portrait SPI panel.
# If the image is shifted or rotated, tune OFFSET/MADCTL first.
XIAOMAN_LCD_DRIVER=st7789
XIAOMAN_LCD_WIDTH=172
XIAOMAN_LCD_HEIGHT=320
XIAOMAN_LCD_X_OFFSET=34
XIAOMAN_LCD_Y_OFFSET=0
XIAOMAN_LCD_MADCTL=0x00
XIAOMAN_LCD_SPI_HZ=8000000
XIAOMAN_LCD_DC_GPIO=118
XIAOMAN_LCD_RESET_GPIO=130
XIAOMAN_LCD_BACKLIGHT_GPIO=147
XIAOMAN_LCD_BACKLIGHT_ACTIVE_HIGH=1
# The 1.47-inch SPI panel on the expansion board is now a status-only dashboard.
XIAOMAN_LCD_STATUS_ONLY=1
XIAOMAN_LCD_STATS_INTERVAL_MS=1000
XIAOMAN_KEYBOARD_ENABLED=1
XIAOMAN_KEYBOARD_DIALOGUE_TIMEOUT_SECONDS=30
# Qt/MIPI-DSI UI can send the same shortcuts as the terminal keyboard through this FIFO.
XIAOMAN_UI_COMMAND_FIFO_ENABLED=1
XIAOMAN_UI_COMMAND_FIFO=/tmp/friday_voice_speaker_ui.fifo
# Voice/backend commands can ask the Qt UI to switch pages through this FIFO.
XIAOMAN_DESKTOP_CONTROL_FIFO=/tmp/friday_voice_speaker_desktop.fifo
# Enable this after building desktop/desktop on the Orange Pi.
XIAOMAN_DESKTOP_AUTOSTART=0
XIAOMAN_DESKTOP_FULLSCREEN=1
# If the Ubuntu desktop still flashes through on touch, set this to 1.
# XIAOMAN_DESKTOP_BYPASS_WM=1
XIAOMAN_DESKTOP_COMMAND=cd /home/orangepi/cpp/friday_voice_speaker/desktop && QT_QPA_PLATFORM=linuxfb:fb=/dev/fb0 QT_QPA_FB_FORCE_FULLSCREEN=1 XIAOMAN_DESKTOP_FULLSCREEN=1 XIAOMAN_UI_COMMAND_FIFO=/tmp/friday_voice_speaker_ui.fifo XIAOMAN_DESKTOP_CONTROL_FIFO=/tmp/friday_voice_speaker_desktop.fifo ./desktop
# Set to a Linux GPIO number to use a physical button for wake. -1 disables it.
XIAOMAN_WAKE_BUTTON_GPIO=-1
XIAOMAN_WAKE_BUTTON_ACTIVE_LOW=1
XIAOMAN_WAKE_BUTTON_POLL_MS=20
XIAOMAN_WAKE_BUTTON_DEBOUNCE_MS=180
XIAOMAN_VOICE_ENABLED=1

# Performance tuning. Increase intervals to lower CPU/temperature.
XIAOMAN_CAMERA_ALWAYS_ON=0
# When CAMERA_ALWAYS_ON=0, vision/camera commands wake capture on demand.
XIAOMAN_CAMERA_IDLE_SLEEP_MS=250
XIAOMAN_CAMERA_WARMUP_MS=2500
# XIAOMAN_CAMERA_CAPTURE_INTERVAL_MS=80
# XIAOMAN_LCD_CAMERA_INTERVAL_MS=160
# XIAOMAN_LCD_EMOJI_INTERVAL_MS=70
# XIAOMAN_PERSON_DETECT_INTERVAL_MS=450
# XIAOMAN_EMOTION_DETECT_INTERVAL_MS=700
# XIAOMAN_VISION_IDLE_SLEEP_MS=200
# XIAOMAN_VISION_FRAME_WAIT_MS=80
# XIAOMAN_VISION_OVERLAY_MAX_AGE_MS=1200
# XIAOMAN_ASR_THREADS=2
XIAOMAN_VOICE_START_RMS=0.012
XIAOMAN_VOICE_STOP_RMS=0.006
XIAOMAN_VOICE_MIN_AVG_RMS=0.006
XIAOMAN_VOICE_MIN_PEAK_RMS=0.018
XIAOMAN_VOICE_NOISE_RATIO=3.0
XIAOMAN_VOICE_CONFIRM_MS=120
XIAOMAN_VOICE_MIN_MS=650
XIAOMAN_VOICE_SILENCE_STOP_MS=900
XIAOMAN_VOICE_PRE_ROLL_MS=300
# Set to 1 temporarily to print RMS/noise gate diagnostics.
XIAOMAN_VOICE_DEBUG=0

# Local resources
XIAOMAN_EMOJI_ROOT=image
XIAOMAN_EMOJI_STATES=正常,微笑,眨眼,兴奋,睡觉,苏醒
XIAOMAN_ASR_MODEL_DIR=models/sherpa-onnx-paraformer-zh-small-2024-03-09
XIAOMAN_LLM_HELPER=xunfei_llm_chat.py

# Chat backend. Use cloud for faster, more natural daily dialogue; local remains available.
NEWBOT_CHAT_BACKEND=cloud
NEWBOT_CLOUD_LLM_MAX_TOKENS=256
NEWBOT_CLOUD_LLM_TEMPERATURE=0.78

# Local LLM helper and llama-server
NEWBOT_LOCAL_LLM_ENABLED=1
NEWBOT_LOCAL_LLM_URL=http://127.0.0.1:8080/v1/chat/completions
NEWBOT_LOCAL_LLM_MODEL=Qwen_Qwen3-0.6B-Q4_0.gguf
NEWBOT_LOCAL_LLM_MODEL_PATH=models/Qwen_Qwen3-0.6B-Q4_0.gguf
NEWBOT_LOCAL_LLM_HOST=127.0.0.1
NEWBOT_LOCAL_LLM_PORT=8080
NEWBOT_LOCAL_LLM_CONTEXT=1024
NEWBOT_LOCAL_LLM_THREADS=4
NEWBOT_LOCAL_LLM_MAX_TOKENS=192
NEWBOT_LOCAL_LLM_DISABLE_THINKING=1
# NEWBOT_LLAMA_SERVER=/home/orangepi/llama.cpp_install/bin/llama-server
NEWBOT_CHAT_MEMORY_ENABLED=1
NEWBOT_CHAT_MEMORY_PATH=cache/chat_memory.json
NEWBOT_CHAT_MEMORY_TURNS=8
NEWBOT_CHAT_MEMORY_MAX_CHARS=240
NEWBOT_PERSONA_PROMPT_PATH=prompts/friday_persona.md
NEWBOT_PERSONA_PROMPT_RELOAD=0

# Local vision models
XIAOMAN_YOLO_PERSON_MODEL=models/yolov6n_85.rknn
XIAOMAN_EMOTION_MODEL=models/face_emotion/face_emotion_yolov5_rk3566_640x640_toolkit160.rknn

# Online TTS and music playback
# Default is voice playback. Use `./smart_voice_speaker --tts-off` for quiet venue tests.
NEWBOT_TTS_ENABLED=1
# Use Microsoft Edge online voices only.
NEWBOT_TTS_BACKEND=edge
NEWBOT_TTS_CLIP_ENABLED=0
NEWBOT_TTS_CLIP_ROOT=voice/friday
NEWBOT_TTS_CACHE_ENABLED=0
NEWBOT_TTS_CACHE_DIR=cache/tts
# Change this after replacing the cloned voice model, or clear cache/tts.
# NEWBOT_TTS_CACHE_NAMESPACE=friday-v1
# Edge TTS voice name. Use `edge-tts --list-voices` to list official voices.
NEWBOT_TTS_VOICE=zh-TW-HsiaoChenNeural
NEWBOT_TTS_RATE=+15%
NEWBOT_TTS_VOLUME=+10%
NEWBOT_TTS_PITCH=-3Hz
# Example command backend. The command can write audio to {output}, or write audio bytes to stdout.
# NEWBOT_TTS_BACKEND=command
# NEWBOT_TTS_COMMAND=python3 /home/orangepi/tts/friday_tts_cli.py --text "{text}" --out "{output}"
# NEWBOT_TTS_COMMAND_OUTPUT_SUFFIX=.wav
NEWBOT_TTS_PLAYER=mpg123
NEWBOT_TTS_ALSA_DEVICE=plughw:1,0
XIAOMAN_MUSIC_PLAYER=ffplay
# XIAOMAN_MUSIC_ALSA_DEVICE=plughw:0,0
# Music source resolver. Keep netease as the safe default.
# Set NEWBOT_MUSIC_PROVIDER=auto after configuring a QQ resolver; it will try QQ first, then NetEase.
NEWBOT_MUSIC_PROVIDER=netease
# QQ Music needs an authorized/self-hosted resolver that returns JSON with url/title/artist.
# Example: {"title":"晴天","artist":"周杰伦","url":"https://..."}
# NEWBOT_QQ_MUSIC_API_URL=http://127.0.0.1:3300/search?source=qq&keyword={query}
# NEWBOT_QQ_MUSIC_API_TOKEN=

# Xunfei vision API. Fill these with your own credentials.
# XUNFEI_VISION_APPID=your_appid
# XUNFEI_VISION_APIKEY=your_apikey
# XUNFEI_VISION_APISECRET=your_apisecret
XUNFEI_VISION_URL=wss://********
XUNFEI_VISION_DOMAIN=imagev3
NEWBOT_VISION_PERSONA_ENABLED=1
# Rewrite raw vision facts through the Friday persona before speaking.
NEWBOT_VISION_REFINE_ENABLED=1
NEWBOT_VISION_REFINE_MODE=cloud
NEWBOT_VISION_REFINE_MAX_TOKENS=64
NEWBOT_VISION_SPEECH_MAX_CHARS=80
NEWBOT_VISION_DEBUG=0

# Cloud text LLM is enabled for the normal chat backend.
NEWBOT_ALLOW_CLOUD_LLM_FALLBACK=1
XUNFEI_APIPASSWORD=********
